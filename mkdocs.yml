validation:
  links:
    not_found: warn

markdown_extensions:
  - admonition                   # !!! note / warning / tip blocks
  - attr_list                    # img/link attributes
  - md_in_html                   # markdown inside HTML blocks
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: 锚链接
  - pymdownx.details             # collapsible blocks
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys                # keyboard keys: ++ctrl+c++

# Top-level navigation: every page enumerated explicitly so the side nav
