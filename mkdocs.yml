site_name: Hi3403 Developer Center
site_url: https://gitbubble.github.io/hi3403-docs/

site_description: Documentation for the HiSilicon SS928V100 / SS927V100 Hi3403 platform
site_author: Hi3403 community

repo_name: GitBubble/hi3403-docs
repo_url: https://github.com/GitBubble/hi3403-docs
edit_uri: edit/main/docs/

copyright: >
  Documentation © 2026 Hi3403 contributors —
  <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>

theme:
  name: material
  language: zh   # default, the i18n plugin overlays /en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom        # RPi-style raspberry red, defined in extra.css
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  features:
    - navigation.tracking         # update URL on scroll
    - navigation.tabs             # top-level tabs (RPi-style)
    - navigation.tabs.sticky
    - navigation.sections         # sections in side nav
    - navigation.expand           # expand sidebar sections
    - navigation.indexes          # section index pages
    - navigation.top              # back-to-top button
    - navigation.footer
    - navigation.path             # breadcrumbs
    - navigation.prune            # smaller nav payload
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.line_numbers   # line numbers in code blocks
    - content.action.edit         # "edit this page" link
    - content.tabs.link
    - content.tooltips            # glossary tooltips
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/logo.css

extra:
  social:
    - icon: simple/gitee
      link: https://gitee.com/HiSpark/pegasus
      name: Gitee 主仓
    - icon: fontawesome/brands/github
      link: https://github.com/raspberrypi/documentation
      name: 灵感来源 (RPi docs)
  generator: false               # hide "Made with MkDocs" footer

