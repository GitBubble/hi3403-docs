site_name: Pegasus Documentation
site_url: https://gitbubble.github.io/hi3403-docs/
site_description: Documentation for the HiSilicon SS928V100 / SS927V100 Pegasus platform
site_author: Pegasus community

repo_name: GitBubble/hi3403-docs
repo_url: https://github.com/GitBubble/hi3403-docs
edit_uri: edit/main/docs/

copyright: >
  Documentation © 2026 Pegasus contributors —
  <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>

theme:
  name: material
  language: zh   # default, the i18n plugin overlays /en
  # Add `custom_dir: overrides/` and `logo:` / `favicon:` here once
  # those assets exist. Material's defaults are clean enough for v1.
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom        # RPi-style raspberry red, defined in extra.css
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  features:
    - navigation.tracking        # update URL on scroll
    - navigation.tabs            # top-level tabs (RPi-style)
    - navigation.tabs.sticky
    - navigation.sections        # sections in side nav
    - navigation.indexes         # section index pages
    - navigation.top             # back-to-top button
    - navigation.footer
    - navigation.path            # breadcrumbs
    - navigation.prune           # smaller nav payload
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit        # "edit this page" link
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: simple/gitee
      link: https://gitee.com/HiSpark/pegasus
      name: Gitee 主仓
    - icon: fontawesome/brands/github
      link: https://github.com/raspberrypi/documentation
      name: 灵感来源 (RPi docs)
  generator: false               # hide "Made with MkDocs" footer

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      # Translations live under docs/<page>.<locale>.md (suffix style).
      # Missing English pages fall back to the Chinese version, so we
      # can ship zh-CN first and grow English incrementally.
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: zh
          default: true
          name: 中文 (简体)
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            "首页": "Home"
            "快速开始": "Get started"
            "开发板": "Boards"
            "操作系统": "OS"
            "SoC 与 Linux": "SoC & Linux"
            "多媒体与 AI": "Multimedia & AI"
            "工具": "Tools"
            "参考": "Reference"
            "教程": "Tutorials"
            "社区": "Community"
  - tags
  - glightbox                    # image lightbox

validation:
  links:
    # The migrated upstream corpus contains many generated cross-file links
    # whose targets were renamed, split, or not imported yet. Keep `--strict`
    # for configuration/build warnings, but let link debt be handled by the
    # dedicated `make linkcheck` workflow while migration stabilizes.
    not_found: ignore

markdown_extensions:
  - admonition                   # !!! note / warning / tip blocks
  - attr_list                    # img/link attributes
  - md_in_html                   # markdown inside HTML blocks
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: 锚链接
  - pymdownx.details             # collapsible blocks
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys                # keyboard keys: ++ctrl+c++

