<?xml version="1.0" encoding="UTF-8"?>
<!--
  HiSpark favicon
  - Rounded-square tile with a raspberry→deep-rose gradient (matches site theme)
  - Stylized "H" with a gold spark replacing the right serif top
  - Reads as both "H" and a spark/lightning at small sizes
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HiSpark">
  <title>HiSpark</title>
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2336a"/>
      <stop offset="100%" stop-color="#a3133b"/>
    </linearGradient>
    <radialGradient id="favSpark" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%"   stop-color="#fff3c2"/>
      <stop offset="55%"  stop-color="#ffc24c"/>
      <stop offset="100%" stop-color="#f08a1c"/>
    </radialGradient>
  </defs>

  <!-- background tile -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#favBg)"/>

  <!-- subtle inner highlight -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12"
        fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Stylized H: two posts + crossbar (white) -->
  <g fill="#ffffff">
    <rect x="14" y="16" width="8" height="32" rx="1.5"/>
    <rect x="42" y="16" width="8" height="32" rx="1.5"/>
    <rect x="22" y="28" width="20" height="8" rx="1.5"/>
  </g>

  <!-- Gold spark perched on the top-right corner of the H -->
  <g transform="translate(50 16)">
    <circle r="8" fill="#ffc24c" fill-opacity="0.20"/>
    <path d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z"
          fill="url(#favSpark)"/>
    <circle r="1.3" fill="#ffffff"/>
  </g>
</svg>
