<?xml version="1.0" encoding="UTF-8"?>
<!--
  HiSpark wordmark
  - Anthracite (#1a1a1a) text reads on white drawer/search AND on raspberry-red header.
  - Gold spark accent (#ffc24c) pops on every background.
  - Inspired by the original HiSpark mark (red star above 'i'), reimagined as
    a 4-point gleam with soft halo and a tiny secondary sparkle for flourish.
  - In dark mode the wordmark is recolored to ivory via extra.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88"
     role="img" aria-label="HiSpark">
  <title>HiSpark</title>

  <defs>
    <radialGradient id="hsSparkGrad" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%"   stop-color="#fff3c2"/>
      <stop offset="45%"  stop-color="#ffc24c"/>
      <stop offset="100%" stop-color="#f08a1c"/>
    </radialGradient>
    <radialGradient id="hsSparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffc24c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffc24c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g fill="#1a1a1a"
     font-family="'Inter','Helvetica Neue',Arial,sans-serif"
     font-weight="800"
     letter-spacing="-2">
    <text x="0"  y="64" font-size="60">Hi</text>
    <text x="68" y="64" font-size="60">Spark</text>
  </g>

  <g transform="translate(56 18)">
    <circle r="16" fill="url(#hsSparkGlow)"/>
    <path d="M0 -11 L2.5 -2.5 L11 0 L2.5 2.5 L0 11 L-2.5 2.5 L-11 0 L-2.5 -2.5 Z"
          fill="url(#hsSparkGrad)"/>
    <circle r="1.8" fill="#ffffff"/>
    <g transform="translate(10 -9)">
      <path d="M0 -2.5 L0.8 -0.8 L2.5 0 L0.8 0.8 L0 2.5 L-0.8 0.8 L-2.5 0 L-0.8 -0.8 Z"
            fill="#ffe28a"/>
    </g>
  </g>
</svg>
